# Bouwt de Windows-installer van AESEO. Deze repo is openbaar, dus bouwen is gratis.
# - De broncode komt uit de privé-repo ashalaan/aeseo (alleen-lezen token AESEO_SRC) en wordt niet gepubliceerd.
# - Alleen handmatig te starten door de eigenaar (workflow_dispatch).
# - Na afloop gaat de bouw op slot (workflow uitgeschakeld); logs en de installer worden opgeruimd door opruimen.yml.
name: Build AESEO

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch of commit in ashalaan/aeseo'
        default: 'main'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Broncode ophalen (privé, alleen lezen)
        uses: actions/checkout@v4
        with:
          repository: ashalaan/aeseo
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AESEO_SRC }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pakketten installeren (met herhaling)
        working-directory: app
        shell: bash
        run: |
          for i in 1 2 3; do npm install --no-audit --no-fund --loglevel=error && exit 0; echo "Poging $i mislukt"; sleep 20; done
          ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ npm install --no-audit --no-fund --loglevel=error
      - name: Typecheck
        working-directory: app
        continue-on-error: true
        run: npm run typecheck
      - name: Bouwen
        working-directory: app
        run: npm run build
      - name: Installer maken
        working-directory: app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          for i in 1 2 3; do
            npx electron-builder --win --publish never -c.publish.provider=github -c.publish.owner=ashalaan -c.publish.repo=aeseo-updates && exit 0
            echo "Poging $i mislukt"; sleep $((i*45))
          done
          exit 1
      - name: Publiceren (alleen nieuwste versie)
        working-directory: app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          V=v$(node -p "require('./package.json').version")
          gh release view "$V" -R "$R" >/dev/null 2>&1 || gh release create "$V" -R "$R" --draft --title "AESEO $V" --notes "AESEO $V"
          for f in release/*.exe release/*.blockmap release/latest*.yml; do
            [ -f "$f" ] || continue
            for i in 1 2 3 4 5; do gh release upload "$V" "$f" --clobber -R "$R" && break; sleep $((i*20)); done
          done
          gh release edit "$V" -R "$R" --draft=false --latest
          # Oudere releases weg
          for t in $(gh release list -R "$R" --limit 100 --json tagName --jq '.[].tagName'); do
            [ "$t" = "$V" ] || gh release delete "$t" -R "$R" --yes --cleanup-tag || true
          done

  # Altijd: bouw op slot, oude logs weg
  slot:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Bouw uitschakelen en oude logs wissen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          for id in $(gh run list -R "$R" --limit 100 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId'); do
            gh api -X DELETE "repos/$R/actions/runs/$id" >/dev/null 2>&1 || true
          done
          gh workflow disable build.yml -R "$R"
